name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # v4.8.0 "Sentinel": the release gate.  Every portable verification
  # suite must pass BEFORE anything is packaged or published - a release
  # is created only when build (3 platforms) AND test are green.
  # "maybe it works" is not a shippable state.
  test:
    name: Test gate (full regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile every module (syntax gate)
        run: python -m compileall -q vpeen scripts

      - name: Tunnel-mode verification (v4.8.0 root-cause fixes)
        run: python scripts/test_tunnel_fixes.py

      - name: Self-update verification (check/download/verify/swap)
        run: python scripts/test_selfupdate.py

      - name: Speed & quality pass regression
        run: python scripts/test_speed_pass.py

      - name: Fix-pack regression
        run: python scripts/test_vpeen_fixes.py

      - name: Integration regression
        run: python scripts/test_vpeen_integration.py

      - name: Web UI regression (demo mode)
        run: python scripts/test_webui_demo.py

      # v4.9.0: Windows installer (setup exe) verification
      - name: Installer verification (setup exe + updater compat)
        run: python scripts/test_installer.py

      # v4.9.0: kill switch state machine + containment engine
      - name: Kill switch verification
        run: python scripts/test_killswitch.py

      # v4.9.0: Persian UI / RTL dictionary integrity
      - name: i18n verification (en + fa, RTL)
        run: python scripts/test_i18n.py

      # v4.9.0: split tunneling (bypass list) per desktop
      - name: Split-tunneling verification
        run: python scripts/test_bypass.py

      # v4.9.0: protection self-check engine + endpoint
      - name: Doctor verification
        run: python scripts/test_doctor.py

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: VPeeN-Windows
          - os: macos-latest
            asset: VPeeN-macOS
          - os: ubuntu-latest
            asset: VPeeN-Linux

    steps:
      - uses: actions/checkout@v4

      # Read the app version so release assets carry it in their filename
      # (VPeeN-4.1.2-Windows.zip) - prevents "which build am I running?"
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(sed -n 's/^__version__ = \"\(.*\)\"$/\1/p' vpeen/__init__.py)" >> "$GITHUB_OUTPUT"

      # Linux: distro interpreter (the web GUI needs no GUI libs here;
      # the frozen Linux build opens the UI in the default browser)
      - name: Setup Python (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip wheel
          .venv/bin/pip install pyinstaller

      - name: Setup Python (Windows / macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (Windows / macOS)
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip wheel
          pip install pywebview pyinstaller

      - name: Fetch tunnel binaries (macOS - both archs)
        if: runner.os == 'macOS'
        run: python scripts/fetch-binaries.py --only darwin-amd64 darwin-arm64 --skip-wintun

      - name: Fetch tunnel binaries (Windows / Linux)
        if: runner.os != 'macOS'
        run: python scripts/fetch-binaries.py
        env:
          VPeeN_PLATFORM: ${{ runner.os == 'Windows' && 'windows-amd64' || 'linux-amd64' }}

      - name: Ad-hoc sign tun2socks (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - assets/bin/darwin-amd64/tun2socks
          codesign --force --sign - assets/bin/darwin-arm64/tun2socks

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: .venv/bin/pyinstaller vpeen.spec --noconfirm

      - name: Build (Windows / macOS)
        if: runner.os != 'Linux'
        run: pyinstaller vpeen.spec --noconfirm

      # v4.9.0 (user request #1): ship a real SETUP EXE, not just a
      # portable zip.  Inno Setup builds a per-user installer (no UAC,
      # %LOCALAPPDATA%\Programs\VPeeN) with Start Menu shortcuts, an
      # optional desktop icon and a proper "Apps & Features" uninstaller.
      # The zip stays as a secondary asset: the in-app self-updater
      # consumes it for its atomic exe swap.
      - name: Build setup installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y --stop-on-first-failure
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after choco install" }
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\vpeen.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed (rc=$LASTEXITCODE)" }
          Get-Item dist\VPeeN-Setup-*.exe | Format-List Name, Length

      # v4.6.0 (issue #1): ad-hoc code-sign the whole .app bundle.
      # Unsigned PyInstaller bundles are what macOS Gatekeeper flags as
      # "Apple could not verify ..." / "damaged" on Sequoia & Tahoe 26.
      # Ad-hoc signing does NOT replace Apple notarization (that needs a
      # paid Developer ID), but it makes the bundle structurally valid so
      # the documented "Open Anyway" path works cleanly.
      - name: Ad-hoc sign app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/VPeeN.app
          codesign --verify --verbose dist/VPeeN.app || true

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # the setup exe must exist BEFORE this zip step runs - the
          # artifact glob dist/VPeeN-* uploads BOTH assets in one go.
          if (-not (Test-Path "dist\VPeeN-Setup-${{ steps.ver.outputs.version }}.exe")) {
            throw "setup installer missing"
          }
          Compress-Archive -Path dist/VPeeN.exe -DestinationPath dist/VPeeN-${{ steps.ver.outputs.version }}-Windows.zip

      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y VPeeN-${{ steps.ver.outputs.version }}-macOS.zip VPeeN.app

      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/VPeeN
          tar -czf dist/VPeeN-${{ steps.ver.outputs.version }}-Linux.tar.gz -C dist VPeeN

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/VPeeN-*

  release:
    name: Release
    # v4.8.0 "Sentinel": gated on the full test suite too - a failing
    # regression anywhere means NO release, period (0.001% doubt = no
    # publish).
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      # v4.6.0 (issue #2): ship the VPeeN Bridge Chrome extension as a
      # load-unpacked zip attached to every release.
      # v4.9.0: it is built into release/ so it is an asset like any
      # other and gets a SHA256SUMS entry - it used to ship unverified.
      - name: Package Chrome extension
        run: |
          mkdir -p release
          cd extension
          zip -r ../release/VPeeN-Chrome-Extension.zip .

      # v4.8.0 "Sentinel": checksum every asset.  The in-app self-updater
      # refuses to install ANY release that lacks a matching SHA256SUMS.txt
      # entry - integrity between CI and the user's disk is the contract
      # that makes one-click updates safe.
      # v4.9.0: sums are written OUTSIDE release/, so the file never hashes
      # itself and every asset in the directory - the 4 platform binaries
      # AND the extension zip - is covered.  The -ge 5 tripwire fails the
      # release if any asset went missing from the checksum contract.
      - name: Generate SHA256SUMS.txt
        run: |
          cd release
          sha256sum * > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt
          [ "$(wc -l < SHA256SUMS.txt)" -ge 5 ]

      # v4.9.0: publish the matching CHANGELOG-vX.Y.Z.md as the release
      # body.  The guard means a missing changelog can never break a
      # release - it falls back to a plain link to the commits.
      - name: Prepare release body
        run: |
          if [ -f "CHANGELOG-${GITHUB_REF_NAME}.md" ]; then
            cp "CHANGELOG-${GITHUB_REF_NAME}.md" release-body.md
          else
            printf 'See the [commits](https://github.com/SirBNL/VPeeN/commits/%s) for what changed.\n' "${GITHUB_REF_NAME}" > release-body.md
          fi

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
            SHA256SUMS.txt
          body_path: release-body.md
          generate_release_notes: true
