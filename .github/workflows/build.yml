name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: VPeeN-Windows
          - os: macos-latest
            asset: VPeeN-macOS
          - os: ubuntu-latest
            asset: VPeeN-Linux

    steps:
      - uses: actions/checkout@v4

      # Linux: use the distro interpreter + distro Tk (Xft-enabled fonts)
      - name: Setup Python (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip wheel
          .venv/bin/pip install customtkinter==5.2.2 pillow pyinstaller

      - name: Setup Python (Windows / macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (Windows / macOS)
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip wheel
          pip install customtkinter==5.2.2 pillow pyinstaller

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: .venv/bin/pyinstaller vpeen.spec --noconfirm

      - name: Build (Windows / macOS)
        if: runner.os != 'Linux'
        run: pyinstaller vpeen.spec --noconfirm

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/VPeeN.exe -DestinationPath dist/${{ matrix.asset }}.zip

      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y ${{ matrix.asset }}.zip VPeeN.app

      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/VPeeN
          tar -czf dist/${{ matrix.asset }}.tar.gz -C dist VPeeN

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
