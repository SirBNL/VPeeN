name: Release tools

# v4.9.0 "Sangar" ops toolbox.  Manual, maintainer-only helpers for the
# LIVE release.  Everything here is dispatchable on demand; nothing runs
# on a schedule and nothing touches the repository state.
#
#   repair-sums  - rebuild SHA256SUMS.txt for the latest release
#                  (surgical: appends missing entries only, refuses if a
#                  recorded hash does not match the live asset; uploaded
#                  with the battle-tested `gh release upload --clobber`)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the plan, change nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  repair-sums:
    name: Rebuild SHA256SUMS.txt (latest release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute the complete sums file
        run: |
          python scripts/release_sums.py ${{ inputs.dry_run && '--dry-run' || '--output' }} /tmp/SHA256SUMS.txt
          if [ ! -f /tmp/SHA256SUMS.txt ]; then
            echo "no changes needed (or dry run) - nothing to upload"; exit 0
          fi
          cat /tmp/SHA256SUMS.txt

      - name: Upload with gh release upload --clobber
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="$(gh release view --json tagName -q .tagName)"
          echo "repairing sums on ${TAG}"
          gh release upload "${TAG}" /tmp/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
